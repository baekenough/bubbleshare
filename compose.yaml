services:
  agent:
    profiles: ["cli"]
    image: vivi-agent:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - agent-state:/app/.vivi
      - ./output:/app/output

  web:
    image: vivi-agent:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    entrypoint: ["uvicorn"]
    command: ["vivi_agent.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      VIVI_STATE_DIR: /app/.vivi/product
      VIVI_CUSTOMER_ID: demo
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - agent-state:/app/.vivi

volumes:
  agent-state:
