[project]
name = "vivi-agent"
version = "0.1.0"
description = "Evidence-grounded AI visibility action agent"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "latticedb==0.15.0",
  "openai>=2,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[project.scripts]
vivi-agent = "vivi_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vivi_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
